<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" fill="none">
  <!-- Gradients definitions -->
  <defs>
    <!-- Cyan-blue gradient for airplane and swoop -->
    <linearGradient id="cyan-blue-grad-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#0057B8" />
    </linearGradient>
    <!-- Cyan gradient for bottom checkmark -->
    <linearGradient id="checkmark-grad-full" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D5DF" />
      <stop offset="100%" stop-color="#0099B8" />
    </linearGradient>
  </defs>

  <!-- Group containing Airplane and Swoop flight path -->
  <g id="airplane-group">
    <!-- Swoop trail -->
    <path d="M 270 95 C 290 85, 330 60, 360 40 C 330 65, 295 85, 275 90 C 272 91, 270 93, 270 95 Z" fill="url(#cyan-blue-grad-full)" />
    <!-- Stylized Swoop Arch -->
    <path d="M265 95 C295 90, 335 70, 370 45 C380 38, 395 30, 410 25 C395 35, 370 55, 345 75 C310 95, 280 102, 265 95 Z" fill="url(#cyan-blue-grad-full)" />
    
    <!-- Airplane -->
    <path d="M 330 60 L 342 63 L 340 50 L 332 40 L 328 42 L 332 50 Z" fill="url(#cyan-blue-grad-full)" /> <!-- Tail fin -->
    <!-- Wing left -->
    <path d="M 345 55 L 375 75 L 368 78 L 348 62 Z" fill="url(#cyan-blue-grad-full)" />
    <!-- Wing right (Main visible wing) -->
    <path d="M 335 48 L 350 20 L 362 25 L 342 45 Z" fill="url(#cyan-blue-grad-full)" />
    <!-- Fuselage -->
    <path d="M 320 52 C 335 45, 375 30, 400 22 C 390 32, 360 55, 340 65 C 330 70, 320 65, 320 52 Z" fill="url(#cyan-blue-grad-full)" />
    
    <!-- Floating particles/dots (Travel theme) -->
    <circle cx="310" cy="85" r="3" fill="#00C9FF" />
    <circle cx="295" cy="92" r="2.5" fill="#00C9FF" />
    <circle cx="282" cy="96" r="2" fill="#00C9FF" />
    <circle cx="340" cy="88" r="2" fill="#00C9FF" />
    <circle cx="355" cy="82" r="3" fill="#0057B8" />
    <circle cx="368" cy="74" r="2" fill="#00C9FF" />
    <circle cx="380" cy="65" r="1.5" fill="#00C9FF" />
    <circle cx="325" cy="35" r="2" fill="#00C9FF" />
    <circle cx="338" cy="28" r="2.5" fill="#00C9FF" />
  </g>

  <!-- Wordmark VISAFORMULA -->
  <!-- "VISA" in Purple -->
  <text x="75" y="145" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#6A1B8C" letter-spacing="-1">VISA</text>
  <!-- "FORMULA" in Cyan-Blue Gradient -->
  <text x="200" y="145" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="url(#cyan-blue-grad-full)" letter-spacing="-1">FORMULA</text>

  <!-- Tagline: GLOBAL VISA MARKETPLACE -->
  <text x="250" y="180" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#6A1B8C" letter-spacing="1.5" text-anchor="middle">GLOBAL VISA MARKETPLACE</text>
  <!-- Tagline decorative dots -->
  <circle cx="102" cy="174" r="4.5" fill="#00C9FF" />
  <circle cx="395" cy="176" r="3" fill="#00C9FF" />
  <circle cx="240" cy="186" r="2.5" fill="#00C9FF" />

  <!-- Bottom Visa Checkmark Element -->
  <g id="bottom-checkmark" transform="translate(0, 5)">
    <!-- Stylized rounded Checkmark/V -->
    <path d="M 215 195 C 225 195, 250 225, 260 230 C 270 225, 295 195, 305 195 C 295 202, 270 240, 260 240 C 250 240, 225 202, 215 195 Z" fill="url(#checkmark-grad-full)" />
    <!-- Floating dot over checkmark -->
    <circle cx="260" cy="204" r="4.5" fill="#00C9FF" />
  </g>
</svg>
